<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퀴즈 시작</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px 20px;
      background: #f4f6f8;
      text-align: center;
    }

    h2 {
      font-size: clamp(24px, 6vw, 36px);
      margin-bottom: 24px;
    }

    select {
      width: 220px;
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 30px;
      padding: 14px 30px;
      font-size: 18px;
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2277dd;
    }
  </style>

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "vqru6iwnq8");
</script>
</head>
<body>
  <h2>🎯 사진 이름 퀴즈 시작</h2>

  <div>
    <select id="range-grade"><option value="">전체 학년</option></select>
    <select id="range-dept"><option value="">전체 학과</option></select>
    <select id="range-class"><option value="">전체 반</option></select>
  </div>
  <script type="module">
    // [M2] 학년/학과/반 옵션을 학교 설정에서 생성
    const { loadSchool, levels, units, classOptions } = await import('./src/js/school.js');
    await loadSchool().catch(() => {});
    document.getElementById('range-grade').insertAdjacentHTML('beforeend',
      levels().map(l => `<option value="${l.order}">${l.label}</option>`).join(''));
    const majors = [...new Set(units().map(u => u.major).filter(Boolean))];
    document.getElementById('range-dept').insertAdjacentHTML('beforeend',
      majors.map(m => `<option value="${m}">${m}</option>`).join(''));
    document.getElementById('range-class').insertAdjacentHTML('beforeend',
      classOptions().map(o => `<option value="${o.value}">${o.label}</option>`).join(''));
  </script>

  <button onclick="startQuiz()">퀴즈 시작</button>

  <script>
    function startQuiz() {
      const grade = document.getElementById("range-grade").value;
      const dept = document.getElementById("range-dept").value;
      const cls = document.getElementById("range-class").value;

      const params = new URLSearchParams();

      if (grade) params.set("grade", grade);
      if (dept) params.set("dept", dept);
      if (cls) {
        const [g, c] = cls.split("-");
        params.set("grade", g); // 클래스 선택 시 grade 덮어씀
        params.set("class", c);
      }

      // 퀴즈 페이지로 이동
      window.location.href = "quiz.html?" + params.toString();
    }
  </script>
</body>
</html>
