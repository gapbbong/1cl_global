[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Non-deployed dirs: DB backup dumps + archived mini-apps + scratch scripts.
  # The deployed bundle (dist/) and all first-party source are still scanned.
  SECRETS_SCAN_OMIT_PATHS = "_legacy/**,backups/**,_backup_private/**,temp_unzip/**,node_tmp/**,scratch/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Secure API gateway. Served by the EDGE function (Deno, runs at the PoP nearest
# the user) — ~350ms faster per call than the us-east-1 Lambda.
# The Lambda (netlify/functions/api.mjs) stays as a fallback.
#   ROLLBACK: delete/rename netlify/edge-functions/api.js and redeploy — the
#   redirect below then routes /api/* back to the Lambda automatically.
[[edge_functions]]
  path = "/api/*"
  function = "api"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 학생 설문 짧은 링크: q.creat1324.com/f/<token> → 설문 폼 (survey-form.js가 경로에서 토큰 파싱)
[[redirects]]
  from = "/f/*"
  to = "/survey-form.html"
  status = 200

# 셀프 학교 개설: signup.creat1324.com 루트 및 아무 도메인/start → 개설 폼
[[redirects]]
  from = "https://signup.creat1324.com/"
  to = "/signup.html"
  status = 200
[[redirects]]
  from = "/start"
  to = "/signup.html"
  status = 200
