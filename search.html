<html lang="ko">

  <link rel="stylesheet" href="src/css/main.css?v=5.08">
  <link rel="stylesheet" href="src/css/search.css?v=5.08">

  <h2>🔍 학생 현황 및 검색</h2>

  <div class="search-container">
    <form id="searchForm" class="search-form">
      <select id="category">
        <option value="이름" selected>이름</option>
        <option value="학번">학번</option>

    </form>
  </div>

  <div id="result-count"></div>
  <div id="results"></div>

  <!-- 학년별/과별 인원 통계 -->
