<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalHub</title>
<style>body{margin:0;background:#f5f7fb;color:#172033;font:14px Arial}.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #e5e9f0;padding:24px 12px}.logo{margin:0 10px 28px}.logo span{color:#365cf5}.nav button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:14px;border-radius:9px;margin:4px 0;color:#647086;cursor:pointer}.nav button.active,.nav button:hover{background:#eef2ff;color:#365cf5;font-weight:bold}.main{flex:1;padding:32px;max-width:1200px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0 0 6px}.muted{color:#718096}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:20px;margin-bottom:18px}.primary,.ghost{padding:10px 14px;border-radius:8px;cursor:pointer}.primary{background:#365cf5;color:#fff;border:0}.ghost{background:#fff;border:1px solid #dfe4ec}.school-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input,.field select,.field textarea{border:1px solid #dfe4ec;border-radius:8px;padding:11px;width:100%;box-sizing:border-box}.class-counter{display:flex;gap:10px;align-items:center}.class-counter input{max-width:80px;text-align:center}.class-counter button{width:35px;height:35px;border-radius:50%;padding:0;font-size:20px}.settings-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f5}.settings-row .q{flex:1}.tag{background:#eef2ff;color:#365cf5;padding:5px 8px;border-radius:5px;font-size:11px}.danger,.actions{border:0;background:transparent;color:#365cf5;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 8px;text-align:left;border-bottom:1px solid #edf0f5}.avatar{display:inline-flex;width:36px;height:36px;border-radius:50%;background:#dfe7ff;color:#365cf5;align-items:center;justify-content:center;font-weight:bold;margin-right:8px}@media(max-width:800px){.school-grid{grid-template-columns:1fr}.side{width:64px}.logo{font-size:0}.logo span{font-size:20px}.nav button{font-size:0;text-align:center}.main{padding:18px}}</style>
<div class="app"><aside class="side"><h2 class="logo">Global<span>Hub</span></h2><nav class="nav"><button data-page="school">1. 학교설정</button><button data-page="students">2. 학생관리</button><button data-page="settings">3. 설문설정</button></nav></aside><main class="main" id="page"></main></div><div id="previewPanel" class="preview-panel"></div>
<style>.preview-panel{display:none;position:fixed;right:0;top:0;width:30%;height:100vh;background:#fff;border-left:1px solid #dfe4ec;box-shadow:-8px 0 24px #17203320;z-index:10;overflow:auto}.preview-panel.open{display:block}.preview-head{padding:20px;background:#365cf5;color:#fff;display:flex;justify-content:space-between;align-items:center}.preview-body{padding:20px}.preview-body .field{margin:18px 0}.preview-close{background:#fff;color:#365cf5;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}</style><script>
const students=[['Nguyen Minh Anh','베트남','2026 · A반','경영학과'],['Azizbek Karimov','우즈베키스탄','2026 · B반','컴퓨터공학과']];
let questions=[['성명','단답식'],['사진','사진 업로드'],...['성별','연락처','혈액형','MBTI (모르면 E 또는 I)','주보호자 정보 (연락처·관계)','보조보호자 정보 (연락처·관계)','주보호자와의 친밀도','보조보호자와의 친밀도','형제 관계 (남·녀 중 몇째)','반려동물 종류와 이름','출신 고등학교 및 성적 (%)','졸업 후 희망 직업','학습 관련 고민','취미 / 특기','자주 하는 게임 및 실력 (티어·점수)','좋아하는 음식 / 싫어하는 음식','잠드는 시간 / 평균 수면 시간','인스타 ID (부계정 가능)','나의 장점 3가지','친한 친구 (의지가 되는 친구)','나의 좌우명','나를 힘들게 하는 것','알레르기·복용약·건강 특이사항','가족 종교·나의 종교 활동·신앙적 고민','부모님 중 외국인 여부와 국가','최근 1년간 가장 잘한 일','최근 1년간 후회하거나 고치고 싶은 점','선생님께 드리고 싶은 말 (비공개)'].map(x=>[x,'주관식'])];questions[2][1]=questions[4][1]=questions[8][1]=questions[9][1]='객관식';questions[0][1]=questions[3][1]=questions[5][1]=questions[10][1]=questions[18][1]=questions[19][1]='단답식';let page='school';
const table=()=>'<table class="table"><tr><th>학생</th><th>국가</th><th>학년/반</th><th>전공</th></tr>'+students.map(s=>'<tr><td><span class="avatar">'+s[0][0]+'</span>'+s[0]+'</td><td>'+s[1]+'</td><td>'+s[2]+'</td><td>'+s[3]+'</td></tr>').join('')+'</table>';
function school(){return '<div class="top"><div><h1>1. 학교설정</h1><span class="muted">단축키: Ctrl+1</span></div></div><div class="card"><div class="school-grid"><div class="field"><label>학교명</label><input placeholder="학교명을 입력하세요"></div><div class="field"><label>몇 년제</label><select id="schoolType"><option value="1">4년제</option><option value="2">2·3년제</option><option value="3">고등학교</option><option value="4">중학교</option><option value="5">초등학교</option><option value="6">유치원·어린이집</option></select></div><div class="field"><label>학과명</label><input placeholder="예: 경영학과"></div><div class="field"><label>반 표기 방식</label><select><option>영문 (A, B, C)</option><option>숫자 (1, 2, 3)</option></select></div><div class="field"><label>반 개수</label><div class="class-counter"><button class="ghost" onclick="classes(-1)">−</button><input id="classCount" value="1" readonly><button class="ghost" onclick="classes(1)">＋</button></div></div><div class="field"><label>학교번호</label><input id="schoolNo" readonly placeholder="학교급 코드 + 랜덤 4자리"></div><div class="field"><label>도메인명</label><input pattern="[A-Za-z]{3,}" placeholder="영문 3자리 이상"></div><div class="field"><label>나라</label><div id="countries"><input placeholder="예: 베트남" style="margin-bottom:6px"></div><button class="ghost" onclick="country()">+ 나라 추가</button></div></div><button class="primary" onclick="saveSchool()">학교 설정 저장</button></div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h=page==='school'?school():page==='students'?'<div class="top"><div><h1>2. 학생관리</h1><span class="muted">단축키: Ctrl+2</span></div></div><div class="card">'+table()+'</div>':'<div class="top"><div><h1>3. 설문설정</h1><span class="muted">단축키: Ctrl+3</span></div><div><button class="primary" onclick="addQ()">+ 문항 추가</button> <button class="ghost" onclick="preview()">미리보기</button></div></div><div class="card">'+questions.map((q,i)=>'<div class="settings-row" style="'+(q[2]===false?'opacity:.55':'')+'"><span>☷</span><span class="q"><b>'+(i+1)+'. '+q[0]+'</b></span><span class="tag">'+q[1]+'</span>'+(q[2]===false?'<span class="tag" style="color:#d13b4f">숨김</span>':'')+'<button class="ghost" onclick="typeQ('+i+')">형식 변경</button><button class="danger" onclick="delQ('+i+')">'+(q[2]===false?'복구':'숨기기')+'</button></div>').join('')+'</div>';document.getElementById('page').innerHTML=h}
function classes(n){let e=document.getElementById('classCount');e.value=Math.max(1,Math.min(99,+e.value+n))}function country(){let e=document.createElement('input');e.placeholder='예: 우즈베키스탄';e.style='margin-bottom:6px';document.getElementById('countries').appendChild(e)}function saveSchool(){let e=document.getElementById('schoolNo'),c=document.getElementById('schoolType').value;e.value=c+String(Math.floor(Math.random()*10000)).padStart(4,'0');alert('학교 설정이 저장되었습니다.')}function addQ(){questions.push(['새 문항','단답식',true]);render()}function delQ(i){questions[i][2]=questions[i][2]===false?true:false;render()}function typeQ(i){questions[i][1]=questions[i][1]==='단답식'?'주관식':questions[i][1]==='주관식'?'객관식':questions[i][1]==='객관식'?'사진 업로드':'단답식';render()}function preview(){let p=document.getElementById('previewPanel');p.classList.add('open');p.innerHTML='<div class="preview-head"><b>학생 기초조사 미리보기</b><button class="preview-close" onclick="closePreview()">닫기</button></div><div class="preview-body"><p class="muted">학생에게 실제로 표시되는 설문 화면입니다.</p><div class="field"><label>언어 선택</label><select><option>한국어</option><option>Tiếng Việt</option><option>Oʻzbekcha</option></select></div>'+questions.filter(q=>q[2]!==false).map((q,i)=>'<div class="field"><label>'+(i+1)+'. '+q[0]+'</label>'+(q[1]==='객관식'?'<select><option>선택해 주세요</option><option>남성</option><option>여성</option><option>기타</option></select>':q[1]==='사진 업로드'?'<input type="file" accept="image/*" capture="user"><small class="muted">휴대폰 카메라 촬영 또는 갤러리에서 선택</small>':q[1]==='주관식'?'<textarea rows="3" placeholder="자유롭게 작성해 주세요"></textarea>':'<input placeholder="답변을 입력해 주세요">')+'</div>').join('')+'<button class="primary" onclick="alert(\'미리보기에서는 제출되지 않습니다.\')">제출하기</button></div>'}function closePreview(){document.getElementById('previewPanel').classList.remove('open')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.addEventListener('keydown',e=>{if(e.ctrlKey&&['1','2','3'].includes(e.key)){e.preventDefault();page={1:'school',2:'students',3:'settings'}[e.key];render()}});render();
</script><script>document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey&&['1','2','3'].includes(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();page={1:'school',2:'students',3:'settings'}[e.key];render()}});</script></html>
<script>document.body.style.fontSize='15px';document.querySelectorAll('.tag').forEach(e=>e.style.fontSize='12px');</script>
<script>
if(!questions.some(q=>q[0]==='학번'))questions.unshift(['학번','단답식',true]);
const originalSchool=school;
school=function(){let html=originalSchool();html=html.replace('</div></div><button class="primary"','<div class="field"><label>학번 자리수</label><input id="studentIdLength" type="number" min="1" max="20" value="4" placeholder="예: 4"></div></div></div><button class="primary"');return html};
const originalSaveSchool=saveSchool;
saveSchool=function(){let n=document.getElementById('studentIdLength'),v=Number(n&&n.value);if(!Number.isInteger(v)||v<1||v>20){alert('학번 자리수는 1~20 사이 숫자로 입력해 주세요.');n&&n.focus();return}localStorage.setItem('globalhub.studentIdLength',String(v));originalSaveSchool()};
function validateStudentId(value){let length=Number(localStorage.getItem('globalhub.studentIdLength')||4),s=String(value||'').trim();if(!new RegExp('^\\d{'+length+'}$').test(s))return '학번은 숫자 '+length+'자리로 입력해 주세요.';return ''}
function adjustStudentIdLength(n){let e=document.getElementById('studentIdLength');if(!e)return;e.value=Math.max(1,Math.min(20,Number(e.value||4)+n))}
function ensureStudentIdField(){if(page!=='school')return;let grid=document.querySelector('.school-grid');if(!grid)return;let input=document.getElementById('studentIdLength'),box=input&&input.closest('.field');if(!box){box=document.createElement('div');box.className='field';box.innerHTML='<label>학번 자리수</label><div class="class-counter"><button class="ghost" type="button" onclick="adjustStudentIdLength(-1)">−</button><input id="studentIdLength" type="number" min="1" max="20" value="'+(localStorage.getItem('globalhub.studentIdLength')||4)+'" readonly><button class="ghost" type="button" onclick="adjustStudentIdLength(1)">＋</button></div>';grid.appendChild(box)}else{let row=box.querySelector('.class-counter');if(row){input.className='';input.style='max-width:80px;text-align:center';row.style='display:flex;gap:10px;align-items:center'}}let countryField=Array.from(grid.querySelectorAll('.field')).find(x=>x.querySelector('label')&&x.querySelector('label').textContent.includes('나라'));if(countryField&&box!==countryField)countryField.insertAdjacentElement('afterend',box)}
const baseEnsureStudentIdField=ensureStudentIdField;ensureStudentIdField=function(){baseEnsureStudentIdField();let input=document.getElementById('studentIdLength'),box=input&&input.closest('.field');if(input&&box&&!box.querySelector('.class-counter')){box.innerHTML='<label>학번 자리수</label><div class="class-counter"><button class="ghost" type="button" onclick="adjustStudentIdLength(-1)">−</button><input id="studentIdLength" type="number" min="1" max="20" value="'+(input.value||4)+'" readonly><button class="ghost" type="button" onclick="adjustStudentIdLength(1)">＋</button></div>';input=box.querySelector('#studentIdLength')}let grid=document.querySelector('.school-grid');if(input&&grid){let countryField=Array.from(grid.querySelectorAll('.field')).find(x=>x.querySelector('label')&&x.querySelector('label').textContent.includes('나라'));if(countryField&&box!==countryField)countryField.insertAdjacentElement('afterend',box)}};const renderWithStudentIdField=render;render=function(){renderWithStudentIdField();ensureStudentIdField()};
render();
</script>
<script>new MutationObserver(()=>{document.querySelector('.main').style.marginRight=document.getElementById('previewPanel').classList.contains('open')?'30%':'0'}).observe(document.getElementById('previewPanel'),{attributes:true,attributeFilter:['class']});</script>

<script>(function(){function tok(){let t=localStorage.getItem('globalhub.formToken');if(!t){t=crypto.randomUUID().replaceAll('-','').slice(0,16);localStorage.setItem('globalhub.formToken',t)}return t}function add(){if(page!=='school'||document.getElementById('qrCard'))return;let t=tok(),url='https://q.creat1324.com/f/'+t,d=document.createElement('div');d.id='qrCard';d.className='card';d.innerHTML='<h2>학생 기초조사 QR</h2><p class="muted">학교 또는 반별로 하나의 QR을 만들어 배포하세요.</p><div id="formUrl" style="padding:10px;background:#f5f7fb;border-radius:8px;word-break:break-all">'+url+'</div><div style="margin-top:12px"><button class="ghost" onclick="showQr()">QR 보기</button> <button class="ghost" onclick="copyFormUrl()">주소 복사</button> <button class="ghost" onclick="rotateToken()">토큰 재발급</button></div>';document.getElementById('page').appendChild(d)}window.showQr=function(){let t=tok(),url='https://q.creat1324.com/f/'+t,p=document.getElementById('previewPanel');p.classList.add('open');p.innerHTML='<div class="preview-head"><b>학생 기초조사 QR</b><button class="preview-close" onclick="closePreview()">닫기</button></div><div class="preview-body" style="text-align:center"><img alt="학생 기초조사 QR" style="width:220px;height:220px" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url)+'"><p style="word-break:break-all">'+url+'</p><button class="primary" onclick="downloadQr()">QR 이미지 저장</button></div>'};window.copyFormUrl=async function(){await navigator.clipboard.writeText('https://q.creat1324.com/f/'+tok());alert('주소를 복사했습니다.')};window.rotateToken=function(){localStorage.setItem('globalhub.formToken',crypto.randomUUID().replaceAll('-','').slice(0,16));document.getElementById('qrCard')?.remove();add();alert('새 토큰이 발급되었습니다. 기존 QR은 폐기하세요.')};window.downloadQr=function(){let a=document.createElement('a');a.href='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent('https://q.creat1324.com/f/'+tok());a.download='student-survey-qr.png';a.target='_blank';a.click()};new MutationObserver(add).observe(document.getElementById('page'),{childList:true});setTimeout(add,0)})();</script>
